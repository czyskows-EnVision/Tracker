; Tracker hardware bring-up test.
; Target: ESP32-S3-WROOM-1U-N8R8 (8 MB quad flash, 8 MB octal PSRAM).
; Arduino core 2.0.17 via the espressif32 6.9.0 platform.

[env:tracker]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; N8R8: QIO flash + OPI (octal) PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
  -I ../include
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1          ; USB-Serial-JTAG
  -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = native USB
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  jgromes/RadioLib@7.8.1
  adafruit/Adafruit BNO08x@1.2.7
  adafruit/Adafruit BMP3XX Library@2.1.6
  mikalhart/TinyGPSPlus@1.1.0
  lovyan03/LovyanGFX@1.2.35
